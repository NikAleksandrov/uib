# SPDX-License-Identifier: Apache-2.0
infrastructure:
  allowExistingMutations: false
cluster:
  version: pinned-by-adapter
container:
  integration: none
launcher:
  training: kubeflow
  inference: kuberay
  raySubmitterImage: docker.io/rayproject/ray:2.58.0-py312-cpu@sha256:c3c9573c5c6bfe4127885f79622d6a32064d34cafc7d156ec728aab8657be250
nodes:
  controlPlane: 1
  workers: 1
  cpu: 4
  memory: 8Gi
  disk: 32Gi
  gpus:
    vendor: none
    perWorker: 0
uib:
  enabled: true
  protocol: rocev2
  bindPort: 4791
  transport: udp-sync
  memoryMode: host-staged
  environment: {}
  congestionControl:
    algorithm: none
    abi: 1
    parameters: {}
communication:
  frontend: nccl
  fallbackPolicy: fail
  transportAllowlist: [IB]
  nccl:
    network: IB
    hca: =uib0
    environment: {}
network:
  topology: pairwise
  managementCIDR: 192.0.2.0/24
  dataCIDR: 198.51.100.0/24
  mtu: 1500
  emulationPoint: guest-egress
  shaping:
    enabled: false
  oversubscription:
    enabled: false
measurement:
  seed: 12345
  warmupSteps: 1
  steps: 4
storage: {}
