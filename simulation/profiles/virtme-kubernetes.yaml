# SPDX-License-Identifier: Apache-2.0
infrastructure:
  provider: virtme
  kernel: running
virtme:
  mode: multi-guest
  bridgePrefix: uibv
  sshPortBase: 23000
  extraKernelArguments: []
cluster:
  manager: kubernetes
  version: v1.35.5+k3s1
kubernetes:
  distribution: k3s
  podCIDR: 10.42.0.0/16
  serviceCIDR: 10.43.0.0/16
  disable: [traefik, servicelb]
container:
  runtime: containerd
nodes:
  controlPlane: 1
  workers: 2
network:
  dataInterface: eth0
