# SPDX-License-Identifier: Apache-2.0
infrastructure:
  provider: virtme
  kernel: running
virtme:
  mode: multi-guest
  networkMode: socket
  sshPortBase: 23000
  extraKernelArguments: []
cluster:
  manager: slurm
  version: "26.05"
container:
  runtime: enroot
  integration: pyxis
launcher:
  training: slurm
  inference: slurm-ray
slurm:
  partition: uib
  timeLimit: "00:30:00"
  rendezvousPort: 29500
  exclusive: true
nodes:
  controlPlane: 1
  workers: 2
network:
  dataInterface: eth1
storage:
  uibRuntimePath: /var/lib/uib/runtime
  modelCachePath: /var/cache/uib/models
  resultsPath: /var/lib/uib/results
