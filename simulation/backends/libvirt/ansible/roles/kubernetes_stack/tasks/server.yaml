---
# SPDX-License-Identifier: Apache-2.0

- name: Install the k3s server configuration
  ansible.builtin.template:
    src: server-config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart k3s server

- name: Install the k3s server service
  ansible.builtin.template:
    src: k3s.service.j2
    dest: /etc/systemd/system/k3s.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart k3s server

- name: Start the k3s server
  ansible.builtin.systemd_service:
    name: k3s
    state: started
    enabled: true
    daemon_reload: true

- name: Apply k3s server configuration changes
  ansible.builtin.meta: flush_handlers

- name: Wait for the Kubernetes API
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - get
      - --raw=/readyz
  register: uib_kubernetes_ready
  retries: 60
  delay: 2
  until: uib_kubernetes_ready.rc == 0
  changed_when: false
