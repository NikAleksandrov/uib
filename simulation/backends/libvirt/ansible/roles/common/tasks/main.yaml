---
# SPDX-License-Identifier: Apache-2.0

- name: Wait for cloud-init and SSH
  ansible.builtin.wait_for_connection:
    timeout: 600

- name: Gather facts after SSH is ready
  ansible.builtin.setup:

- name: Require the pinned Ubuntu release
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Ubuntu"
      - ansible_facts.distribution_version is version('24.04', '>=')
      - ansible_facts.distribution_version is version('25.04', '<')
    fail_msg: "The libvirt Slurm adapter requires Ubuntu 24.04"

- name: Install common cluster packages
  ansible.builtin.apt:
    name:
      - build-essential
      - ca-certificates
      - curl
      - git
      - iproute2
      - jq
      - libcap2-bin
      - make
      - munge
      - nfs-common
      - python3
      - qemu-guest-agent
      - squashfs-tools
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Record every cluster node in hosts file
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} UIB LIBVIRT {{ uib_run_id }}"
    block: |
      {% for host in groups['slurm_cluster'] %}
      {{ hostvars[host].uib_data_ip }} {{ host }}
      {% endfor %}

- name: Enable the QEMU guest agent
  ansible.builtin.service:
    name: qemu-guest-agent
    state: started
    enabled: true
