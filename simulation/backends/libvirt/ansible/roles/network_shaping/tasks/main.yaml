---
# SPDX-License-Identifier: Apache-2.0

- name: Create the local helper directory
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the common netem adapter
  ansible.builtin.copy:
    src: "{{ uib_netem_source }}"
    dest: /usr/local/libexec/uib-netem
    owner: root
    group: root
    mode: "0755"

- name: Install the common network fault scheduler
  ansible.builtin.copy:
    src: "{{ uib_fault_schedule_source }}"
    dest: /run/uib-network-schedule
    owner: root
    group: root
    mode: "0755"

- name: Install the common rank fault scheduler
  ansible.builtin.copy:
    src: "{{ uib_rank_schedule_source }}"
    dest: /usr/local/libexec/uib-rank-schedule
    owner: root
    group: root
    mode: "0755"

- name: Install the stable worker fault target
  ansible.builtin.copy:
    dest: /run/uib-fault-target
    owner: root
    group: root
    mode: "0644"
    content: "{{ uib_fault_targets[inventory_hostname] }}\n"

- name: Authorize simulation-only network mutations
  ansible.builtin.copy:
    dest: /etc/sudoers.d/uib-network-schedule
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
    content: >-
      {{ uib_ssh_user }} ALL=(root) NOPASSWD:
      /usr/local/libexec/uib-netem *,
      /usr/sbin/ip link set dev *

- name: Install the resolved network configuration
  ansible.builtin.copy:
    src: "{{ uib_config }}"
    dest: /run/uib-simulation.json
    owner: root
    group: root
    mode: "0644"

- name: Set the worker data-plane MTU
  ansible.builtin.command:
    argv:
      - /usr/sbin/ip
      - link
      - set
      - dev
      - "{{ uib_data_interface }}"
      - mtu
      - "{{ uib_network_mtu | string }}"
  changed_when: true

- name: Apply worker data-plane network shaping
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/uib-netem
      - apply
      - /run/uib-simulation.json
      - "{{ uib_data_interface }}"
      - --target
      - "{{ uib_fault_targets[inventory_hostname] }}"
      - --replace-existing
  register: uib_netem_apply
  changed_when: uib_endpoint_shaping[inventory_hostname].enabled | bool
  when: uib_network_emulation_point == 'guest-egress'

- name: Preserve the applied netem command for post-traffic evidence
  ansible.builtin.copy:
    dest: /run/uib-netem-command
    owner: root
    group: root
    mode: "0644"
    content: "{{ uib_netem_apply.stdout | trim }}\n"
  when: uib_network_emulation_point == 'guest-egress'
