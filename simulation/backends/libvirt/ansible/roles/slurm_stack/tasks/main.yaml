---
# SPDX-License-Identifier: Apache-2.0

- name: Install the pinned Slurm packages
  ansible.builtin.apt:
    name: "{{ uib_slurm_packages }}"
    state: present

- name: Create Slurm configuration and state directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: /usr/local/libexec
      owner: root
      group: root
      mode: "0755"
    - path: /etc/slurm/plugstack.conf.d
      owner: root
      group: root
      mode: "0755"
    - path: /var/spool/slurmctld
      owner: slurm
      group: slurm
      mode: "0755"
    - path: /var/spool/slurmd
      owner: slurm
      group: slurm
      mode: "0755"
    - path: /var/log/slurm
      owner: slurm
      group: slurm
      mode: "0755"
    - path: /var/lib/enroot
      owner: root
      group: root
      mode: "1777"
    - path: /var/cache/enroot
      owner: root
      group: root
      mode: "1777"

- name: Generate the cluster Munge key once
  when: inventory_hostname in groups['slurm_controller']
  ansible.builtin.command:
    argv:
      - dd
      - if=/dev/urandom
      - of=/etc/munge/munge.key
      - bs=1024
      - count=1
  args:
    creates: /etc/munge/munge.key
  no_log: true

- name: Fetch the cluster Munge key into private run state
  when: inventory_hostname in groups['slurm_controller']
  ansible.builtin.fetch:
    src: /etc/munge/munge.key
    dest: "{{ uib_run_state }}/secrets/munge.key"
    flat: true
  no_log: true

- name: Distribute the cluster Munge key
  ansible.builtin.copy:
    src: "{{ uib_run_state }}/secrets/munge.key"
    dest: /etc/munge/munge.key
    owner: munge
    group: munge
    mode: "0400"
  no_log: true
  notify: Restart Munge

- name: Render Slurm configuration
  ansible.builtin.template:
    src: slurm.conf.j2
    dest: /etc/slurm/slurm.conf
    owner: slurm
    group: slurm
    mode: "0644"
  notify:
    - Restart Slurm controller
    - Restart Slurm worker

- name: Render Slurm cgroup configuration
  ansible.builtin.copy:
    dest: /etc/slurm/cgroup.conf
    owner: slurm
    group: slurm
    mode: "0644"
    content: |
      # SPDX-License-Identifier: Apache-2.0
      CgroupPlugin=autodetect
      ConstrainCores=yes
      ConstrainRAMSpace=yes
      ConstrainDevices=yes
  notify:
    - Restart Slurm controller
    - Restart Slurm worker

- name: Enable the Pyxis plugstack directory
  ansible.builtin.copy:
    dest: /etc/slurm/plugstack.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      include /etc/slurm/plugstack.conf.d/*.conf

- name: Download pinned Enroot and Pyxis artifacts once
  when: inventory_hostname in groups['slurm_controller']
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "/var/cache/uib/downloads/{{ item.name }}"
    checksum: "sha256:{{ item.sha256 }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ uib_stack_downloads }}"

- name: Install the pinned Enroot package
  ansible.builtin.apt:
    deb: /var/cache/uib/downloads/enroot_4.2.1-1_amd64.deb

- name: Install the pinned Enroot capability package
  ansible.builtin.apt:
    deb: /var/cache/uib/downloads/enroot+caps_4.2.1-1_amd64.deb

- name: Create the Enroot configuration directory
  ansible.builtin.file:
    path: /etc/enroot/enroot.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create the Enroot batch runtime root
  ansible.builtin.file:
    path: /run/enroot
    state: directory
    owner: root
    group: root
    mode: "1777"

- name: Configure persistent per-node Enroot caches
  ansible.builtin.copy:
    dest: /etc/enroot/enroot.conf.d/99-uib.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      ENROOT_CACHE_PATH /var/cache/enroot/user-$(id -u)
      ENROOT_DATA_PATH /var/lib/enroot/user-$(id -u)
      ENROOT_RUNTIME_PATH /run/enroot/user-$(id -u)

- name: Extract the pinned Pyxis source
  ansible.builtin.unarchive:
    src: /var/cache/uib/downloads/pyxis-0.24.0.tar.gz
    dest: /usr/local/src
    remote_src: true
    creates: /usr/local/src/pyxis-107519944221822ea1dace4db8e7234b2eaa4cd5/Makefile

- name: Build Pyxis against the installed Slurm headers
  ansible.builtin.command:
    argv:
      - make
      - -C
      - /usr/local/src/pyxis-107519944221822ea1dace4db8e7234b2eaa4cd5
      - install
      - prefix=/usr
  args:
    creates: /usr/lib/slurm/spank_pyxis.so

- name: Load Pyxis through Slurm's plugstack
  ansible.builtin.file:
    src: /usr/share/pyxis/pyxis.conf
    dest: /etc/slurm/plugstack.conf.d/pyxis.conf
    state: link
  notify:
    - Restart Slurm controller
    - Restart Slurm worker

- name: Install the Slurm UIB traffic gate
  ansible.builtin.copy:
    src: uib-verbs-smoke
    dest: /usr/local/libexec/uib-verbs-smoke
    owner: root
    group: root
    mode: "0755"

- name: Start Munge
  ansible.builtin.service:
    name: munge
    state: started
    enabled: true

- name: Flush scheduler configuration changes
  ansible.builtin.meta: flush_handlers

- name: Start the Slurm controller
  when: inventory_hostname in groups['slurm_controller']
  ansible.builtin.service:
    name: slurmctld
    state: started
    enabled: true

- name: Start the Slurm worker
  when: inventory_hostname in groups['slurm_workers']
  ansible.builtin.service:
    name: slurmd
    state: started
    enabled: true

- name: Verify the UIB data-plane interface
  ansible.builtin.command:
    argv:
      - ip
      - -o
      - -4
      - address
      - show
      - dev
      - "{{ uib_data_interface }}"
      - scope
      - global
  changed_when: false
